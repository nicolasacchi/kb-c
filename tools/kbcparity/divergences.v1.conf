# kbcparity agreed-divergence allowlist, FORMAT VERSION 1.
#
# WHAT THIS FILE IS. One entry per divergence the port has agreed to live
# with. The harness prints these in a bucket of their own, never mixed into
# the pass count, so "accepted" can never be read as "correct".
#
# WHAT THIS FILE IS NOT. A suppression list. The harness fails on a
# divergence that is not here, and it fails on an entry that matches
# nothing, so a list that has grown to cover everything reports STALE and
# goes red. That is the design: this port has twice had a harness report
# correct behaviour as a failure and get ignored within a week, and the fix
# for that is a list with reasons and a tripwire, not a list with no
# tripwire.
#
# The subjects are therefore ENUMERATED per entry, not globbed broadly. The
# 20th document to diverge from a class already accepted is a new fact, and it
# gets a human to read the class again before it is absorbed — that is why
# `capture/summary` lists twenty paths rather than `**/*.md`.
#
# HOW AN ENTRY IS ADDED. By editing this file. Never by the harness. The run
# prints how many entries the file had last time and how many it has now, so
# growth is a visible human decision rather than a silent one.
#
# FIELDS
#   id          unique, kebab-or-dotted, stable; it is what the report prints
#   suite       capture | links | ingest
#   field       the field that diverged, as the harness names it
#   subjects    comma-separated fnmatch globs over the document path.
#               REQUIRED and never empty: an entry naming no subject would
#               match every document of its field, which is the absorption
#               this file exists to prevent.
#   kind        accepted-trade-off        a decision was taken and it costs
#               known-parser-difference  both are right about their own
#                                         grammar and they disagree
#               unported-original-behaviour
#                                         the original does this and kb-c
#                                         does not do it at all
#   reason      one sentence, in prose. Required, and never "expected".
#   accepted_on YYYY-MM-DD, the day a human agreed to it. An undated
#               exception is a rumour.
#   detail      optional regex, matched against the divergence's detail
#               string, to narrow an otherwise broad entry.
#   note        optional, free prose, closed with a line starting "note2:".
#               Read it before widening a subject glob.
#
# ---------------------------------------------------------------- entries --

entry
id = capture.store-bytes.markdown-rendered-at-ingest
suite = capture
field = store_bytes
subjects = *.md, **/*.md
kind = unported-original-behaviour
reason = The Rust indexer renders Markdown to a complete HTML page ONCE at
  ingest and stores THAT; kb-c stores the document's source bytes and renders
  per request. Both answer /api/kb/{kb}/artifact/{id} with the right page,
  so the SERVED bytes agree and the STORED bytes never can.
  (indexer.rs:2344-2350 vs kb-c httpd.c:5231.)
accepted_on = 2026-09-29
note = The subject globs are `*.md` and `**/*.md` because the divergence is
  structural,
  not per-document: every Markdown document has it and every HTML document
  does not — the corpus's .html files MATCH byte for byte on this field,
  which is what makes the glob a statement about Markdown rather than an
  absorption of a new one. A .html document that starts diverging here is a
  failure, not an accepted divergence.
end

entry
id = capture.render.syntax-highlighting-and-narrower-grammar
suite = capture
field = render_bytes
subjects = md/crates/kb-code-server/tests/fixtures/review-doc/acme-app-standard.md,
  md/docs/kb-code.md,
  md/docs/research/kb-reflect-implementation-plan.md,
  md/plugins/kb-memory/skills/kb-distill/SKILL.md
kind = known-parser-difference
reason = kb-c links no syntax highlighter, so a fenced code block carries
  the container chrome and no inline token colours where the Rust render
  pairs comrak with syntect; the hand-rolled grammar underneath is also
  deliberately narrower (markdown.h, INVENTORY.md:147).
  (src/markdown.c:23-26.)
accepted_on = 2026-09-29
note = Subjects are pinned to the four documents that carry a fenced block,
  not to a `**/*.md` glob: the page ENVELOPE (doctype, head, embedded
  stylesheet, body chrome) is byte-identical to the original on every one of
  the 21 documents measured, and the remaining 9 Markdown documents have no
  code block and pass. A fifth code-bearing document therefore FAILS until
  someone looks at it, which is the point.
  Measured 2026-09-29: the first differing line on 3 of the 4 is inside a
  `<pre>`; on md/docs/kb-code.md it is at line 475, outside one, so that
  document carries at least one further grammar difference not yet
  characterised. It is allowed here because it is a RENDER divergence of a
  kind already accepted, and because the exact rule has not been isolated —
  see the report, which says so rather than pretending otherwise.
end

entry
id = capture.summary.lead-sentence-versus-400-char-excerpt
suite = capture
field = summary
subjects = canon/README.md, canon/cost-of-abstraction.html,
  canon/fullscreen-viz.html, canon/kitchen-sink.html, canon/multi-page.html,
  canon/pm/00-summary.html, canon/pm/01-timeline.html, canon/pm/02-cause.html,
  canon/pm/03-actions.html, guide/Runbook.md, infra/deploy.md,
  md/crates/kb-code-server/tests/fixtures/review-doc/acme-app-standard.md,
  md/docs/kb-code.md, md/docs/research/kb-reflect-implementation-plan.md,
  md/docs/research/notes-as-connective-tissue.md,
  md/plugins/kb-memory/hooks/omp-agents/kb-librarian.md,
  md/plugins/kb-memory/skills/kb-distill/SKILL.md, only-here.md, ladder.md,
  ops/Runbook.md, ops/deploy.md
kind = accepted-trade-off
reason = The two sides cut a summary from different material and cap it
  differently. The Rust's is `body_text_excerpt` — the first 400 characters
  of the RENDERED page's text, taken by a DOM walk that skips only
  script/style/template/noscript, so it begins with the document's own
  heading and runs on into whatever the page puts next (parser.rs:540-544).
  kb-c's is the first prose BLOCK of the reader parse, whitespace-collapsed
  and capped at 512 bytes, with the heading excluded because the row already
  carries the title in its own field (app.c, summary_from_blocks). Neither
  string is wrong about the document; they are two answers to "what is this"
  and only one of them can be the lead.
accepted_on = 2026-09-29
note = Measured 2026-09-29 with an empty allowlist, which is what isolated
  the class. On the four `canon/pm/*.html` pages the Rust's summary runs
  "SEV-1 INC-0315 · checkout-api · 2024-03-15 page 3 / 4 Page 03 — Root
  Cause Two bugs, one trigger Neither bug alone would have caused an
  outage." — the running header, the page number and the section heading,
  none of which is a summary. On `canon/kitchen-sink.html` it opens
  "demonstration · the unreasonable effectiveness", which is the page's own
  nav chrome. On the Markdown documents the Rust's carries the raw
  "[[wikilink]]" spelling, because it leaves `[[…]]` as literal text in the
  render by design (links.rs:61-66). kb-c's is the cleaner of the two on
  every one of these; this entry records the difference, not a defect in it.
  What WAS a defect, and is fixed: kb-c's summary used to carry the source's
  emphasis markers verbatim ("You answer questions **from the knowledge
  base**", "the `kb-code` daemon"), which the Rust's DOM walk can never
  produce. Markup is now stripped where a summary is built (app.c) and code
  spans are consumed by the parse (parse.c), so the residual on these 19 is
  the construction above and nothing else.
  Pinned to the 19 documents that diverge. A twentieth fails until someone
  reads it. The other 2 are notes, which carry no summary on either side and
  are reported NOT MEASURED instead.
end

entry
id = links.ladder.dangling-the-rust-route-reports-wikilinks-only
suite = links
field = ladder.dangling
subjects = md/docs/research/kb-reflect-implementation-plan.md
kind = known-parser-difference
reason = The Rust's notes route answers a ladder built ONLY from
  `[[wikilinks]]`: it returns early unless the body contains `[[`
  (notes.rs:319-321) and then resolves `links::parse_wikilinks`, whose
  targets come from comrak's WikiLink nodes. kb-c's route lists every
  outbound link the document has, through the one resolver all three syntaxes
  share. This document links `[evolving-the-kb-memory-system.html](…)` and
  that target is not in the corpus, so kb-c reports it `dangling` and the
  Rust does not mention it at all. kb-c is reporting a link the document
  really has; the Rust is answering a narrower question.
accepted_on = 2026-09-29
note = This entry used to cover TWO targets and to say the rule was unknown.
  Both are wrong now, and the second one was a real defect rather than a
  difference: the second target was `a/sessions/<source_relative>`, an
  `<a href>` the document quotes INSIDE a backtick code span as the permalink
  template it tells the implementer to emit. kb-c's reader was interpreting
  markup inside a code span, minting an edge no author wrote and a `dangling`
  rung for a document nobody linked to. parse.c now treats an inline code
  span as literal (and `extract_metas` as blind inside one), which is the
  same rule the Rust gets from comrak never emitting a link node there. That
  is the one case the harness agent had called "a genuine reader
  disagreement"; it was a bug, and it is fixed rather than allowed.
  Everything else in the links suite matches: 8 edges on each side,
  identical per-document edge sets, identical backlink counts, and every
  ladder case in the ladder fixtures agreeing including the two ambiguous
  ones.
end

entry
id = capture.render.html-artifacts-are-sanitised-on-serve
suite = capture
field = render_bytes
subjects = canon/cost-of-abstraction.html, canon/fullscreen-viz.html,
  canon/kitchen-sink.html, canon/multi-page.html, canon/pm/00-summary.html,
  canon/pm/01-timeline.html, canon/pm/02-cause.html, canon/pm/03-actions.html
kind = accepted-trade-off
reason = kb-c runs every HTML artifact through the corpus's ammonia-equivalent
  sanitiser before serving it on the parent origin (httpd.c, the
  `is_html_doc` branch; the allowlist is html.c:402-413). The Rust does not
  sanitise on EITHER serve path — `artifact_bytes` (docs.rs:1490-1510) and the
  subdomain `serve` (artifact.rs:692-760) both hand back the on-disk bytes,
  and its only ammonia use is opt-in at CAPTURE time (capture.rs:660, off by
  default). So the two cannot agree on the bytes of a document that carries a
  `<style>`, a `class` or a `script`, and kb-c's answer is the smaller one.
  kb-c keeps the filter deliberately: the route is the trusted app origin, and
  the `Content-Security-Policy: sandbox` it sets is a property of the route
  rather than of the bytes.
accepted_on = 2026-09-29
note = The envelope is NOT part of this entry and is not a divergence. The
  sanitiser has no `html`, `head`, `body` or doctype in its allowlist, so
  what it returns is the document's CONTENT and not a document; served that
  way a browser renders it in quirks mode with no title, which is a
  regression in the page rather than a difference between two parsers. The
  serve path now wraps the filtered fragment in a doctype, a charset
  declaration and the document's own `<title>`, and the first differing line
  moved from line 1 to line 2 or 4 — inside the head, not before it. What is
  still open, and is NOT covered here, is the size of the loss: a
  full-screen interactive artifact arrives with its stylesheet and its class
  attributes gone, so it renders as unstyled prose. That is a larger
  regression than the doctype and removing it means dropping a sanitiser from
  a route that serves untrusted corpus content on the app origin, which is the
  operator's decision and not one this entry records as settled.
  The corpus's nine other HTML documents match byte for byte on this field;
  a tenth canonical artifact with a stylesheet fails until someone looks at
  it.
end
